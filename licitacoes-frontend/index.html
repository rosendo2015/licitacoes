<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <title>Login - Sistema de Licitações</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <!-- Coluna esquerda: formulário -->
        <div class="form-section">
            <h2>Login</h2>
            <p>Entre na sua conta.</p>
            <form id="loginForm">
                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="Digite seu e-mail" required>

                <label for="senha">Senha</label>
                <input type="password" id="senha" placeholder="Digite sua senha" required>

                <div class="checkbox">
                    <input type="checkbox" id="lembrar">
                    <label for="lembrar">Lembrar-me</label>
                </div>

                <a href="#">Esqueceu a senha?</a>
                <button class="login-button" type="submit">Entrar</button>
            </form>
            <p>Não tem conta? <a href="register.html">Cadastre-se</a></p>
        </div>

        <!-- Coluna direita: imagem de fundo + texto -->
        <div class="info-section" style="background-image: url('assets/login.png');">
            <div class="overlay">
                <h3>Gerencie todas as <span>licitações</span></h3>
                <p>Controle fornecedores, prazos e documentos de qualquer lugar.</p>
            </div>
        </div>
    </div>

    <!-- Script de integração -->
    <script>
        const form = document.getElementById("loginForm");

        form.addEventListener("submit", async (e) => {
            e.preventDefault();

            const email = document.getElementById("email").value;
            const senha = document.getElementById("senha").value;

            try {
                const response = await fetch("http://localhost:3333/sessions", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, password: senha }),
                });

                if (!response.ok) throw new Error("Login inválido");

                const data = await response.json();
                localStorage.setItem("token", data.token);

                alert("Login realizado com sucesso!");
                window.location.href = "dashboard.html"; // redireciona para área protegida
            } catch (error) {
                alert(error.message);
            }
        });
    </script>
</body>

</html>
