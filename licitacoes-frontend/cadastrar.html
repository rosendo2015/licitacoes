<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Cadastrar Licitação - Sistema de Licitações</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: #f5f6fa;
        }

        /* Menu superior */
        header {
            background: #2c3e50;
            color: #fff;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
        }

        header h1 {
            font-size: 20px;
            margin: 0;
        }

        nav {
            display: flex;
            gap: 20px;
        }

        nav a {
            color: #fff;
            text-decoration: none;
            font-weight: 500;
        }

        nav a:hover {
            text-decoration: underline;
        }

        .actions {
            display: flex;
            gap: 10px;
        }

        .actions button {
            padding: 8px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 500;
        }

        .btn-danger {
            background: #e74c3c;
            color: #fff;
        }

        /* Conteúdo abaixo do menu */
        main {
            margin-top: 80px;
            padding: 20px;
        }

        form {
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
            max-width: 900px;
            margin: auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        form h2 {
            grid-column: span 2;
            margin-top: 0;
        }

        form label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
        }

        form input,
        form textarea,
        form select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        form textarea {
            resize: vertical;
            min-height: 80px;
        }

        form button {
            grid-column: span 2;
            margin-top: 15px;
            padding: 12px;
            background: #3498db;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 500;
        }
    </style>
</head>

<body>
    <!-- Menu superior -->
    <header>
        <h1>Sistema de Licitações</h1>
        <nav>

        </nav>
        <div class="actions">
            <button id="logout" class="btn-danger">Sair</button>
        </div>
    </header>

    <!-- Conteúdo abaixo do menu -->
    <main>
        <form id="licitacaoForm">
            <h2>Cadastrar Nova Licitação</h2>

            <div>
                <label for="data">Data</label>
                <input type="date" id="data" required>
            </div>

            <div>
                <label for="horarioInicio">Horário de Início</label>
                <input type="time" id="horarioInicio" required>
            </div>

            <div>
                <label for="estado">Estado</label>
                <input type="text" id="estado" placeholder="Ex: CE" required>
            </div>

            <div>
                <label for="orgao">Órgão</label>
                <input type="text" id="orgao" required>
            </div>

            <div>
                <label for="pregao">Pregão</label>
                <input type="text" id="pregao" required>
            </div>

            <div>
                <label for="servico">Serviço</label>
                <input type="text" id="servico" required>
            </div>

            <div>
                <label for="uasg">UASG</label>
                <input type="text" id="uasg" required>
            </div>

            <div>
                <label for="status">Status</label>
                <select id="status" required>
                    <option value="EM_ANDAMENTO">Em andamento</option>
                    <option value="CONCLUIDA">Concluída</option>
                    <option value="ADIADA">Adiada</option>
                    <option value="SUSPENSA">Suspensa</option>
                    <option value="REVOGADA">Revogada</option>
                </select>
            </div>

            <div style="grid-column: span 2;">
                <label for="observacoes">Observações</label>
                <textarea id="observacoes"></textarea>
            </div>

            <button type="submit">Cadastrar</button>
        </form>
    </main>

    <script>
        document.getElementById("logout").addEventListener("click", () => {
            localStorage.removeItem("token");
            window.location.href = "index.html";
        });

        const form = document.getElementById("licitacaoForm");
        form.addEventListener("submit", async (e) => {
            e.preventDefault();

            const token = localStorage.getItem("token");
            if (!token) {
                alert("Você precisa estar logado!");
                window.location.href = "index.html";
                return;
            }

            const data = document.getElementById("data").value;
            const horarioInicio = document.getElementById("horarioInicio").value;
            const estado = document.getElementById("estado").value;
            const orgao = document.getElementById("orgao").value;
            const pregao = document.getElementById("pregao").value;
            const servico = document.getElementById("servico").value;
            const uasg = document.getElementById("uasg").value;
            const observacoes = document.getElementById("observacoes").value;
            const status = document.getElementById("status").value;

            try {
                const response = await fetch("http://localhost:3333/licitacoes", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        Authorization: `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        data,
                        horarioInicio,
                        estado,
                        orgao,
                        pregao,
                        servico,
                        uasg,
                        observacoes,
                        status
                    }),
                });

                if (!response.ok) throw new Error("Erro ao cadastrar licitação");

                alert("Licitação cadastrada com sucesso!");
                window.location.href = "dashboard.html"; // volta para a lista
            } catch (error) {
                alert(error.message);
            }
        });
    </script>
</body>

</html>
