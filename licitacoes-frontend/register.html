<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Cadastro - Sistema de Licitações</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <!-- Coluna esquerda: painel informativo -->
        <div class="info-section" style="background-image: url('assets/register.png');">
            <div class="overlay">
                <h3>Plataforma de <span>Licitações</span></h3>
                <p>Cadastre-se para gerenciar fornecedores, documentos e prazos.</p>
            </div>
        </div>

        <!-- Coluna direita: formulário -->
        <div class="form-section">
            <h2>Bem-vindo ao Sistema</h2>
            <form id="registerForm">
                <div class="flex gap1-5">
                    <div class="column">
                        <label for="nome">Nome</label>
                        <input type="text" id="nome" placeholder="Digite seu nome" required>
                    </div>
                    <div class="column">
                        <label for="sobrenome">Sobrenome</label>
                        <input type="text" id="sobrenome" placeholder="Digite seu sobrenome" required>
                    </div>
                </div>

                <div class="flex gap1-5">
                    <div class="column">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" placeholder="Digite seu e-mail" required>
                    </div>
                    <div class="column">
                        <label for="telefone">Telefone</label>
                        <input type="tel" id="telefone" placeholder="Digite seu telefone">
                    </div>
                </div>
                <div class="flex gap1-5">
                    <div class="column">
                        <label for="senha">Senha</label>
                        <input type="password" id="senha" placeholder="Crie uma senha" required>
                    </div>

                    <div class="column">
                        <label for="confirmarSenha">Confirmar Senha</label>
                        <input type="password" id="confirmarSenha" placeholder="Confirme sua senha" required>
                    </div>
                </div>

                <div class="checkbox">
                    <input type="checkbox" id="newsletter">
                    <label for="newsletter">Quero receber novidades</label>
                </div>

                <div class="checkbox">
                    <input type="checkbox" id="termos" required>
                    <label for="termos">Concordo com os Termos e Política de Privacidade</label>
                </div>

                <button class="register-button" type="submit">Criar Conta</button>
            </form>
            <p>Já possui conta? <a href="index.html">Entrar</a></p>
        </div>
    </div>

    <!-- Script de integração -->
    <script>
        const form = document.getElementById("registerForm");

        form.addEventListener("submit", async (e) => {
            e.preventDefault();

            const nome = document.getElementById("nome").value;
            const sobrenome = document.getElementById("sobrenome").value;
            const email = document.getElementById("email").value;
            const senha = document.getElementById("senha").value;
            const confirmarSenha = document.getElementById("confirmarSenha").value;

            if (senha !== confirmarSenha) {
                alert("As senhas não coincidem!");
                return;
            }

            try {
                const response = await fetch("http://localhost:3333/users", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        name: `${nome} ${sobrenome}`,
                        email,
                        password: senha,
                        role: "USER"
                    }),
                });

                if (!response.ok) throw new Error("Erro ao cadastrar usuário");

                alert("Cadastro realizado com sucesso!");
                window.location.href = "index.html"; // volta para login
            } catch (error) {
                alert(error.message);
            }
        });
    </script>
</body>

</html>
