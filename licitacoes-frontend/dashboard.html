<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Dashboard - Sistema de Licitações</title>
    <link rel="stylesheet" href="dashboard.css">
</head>

<body>
    <!-- Menu superior -->
    <header>
        <h1>Sistema de Licitações</h1>
        <nav>

        </nav>
        <div class="actions">
            <button id="btnCadastrar" class="btn-primary">Cadastrar Licitação</button>
            <button id="logout" class="btn-danger">Sair</button>
        </div>
    </header>

    <!-- Conteúdo abaixo do menu -->
    <main>

        <div class="cards-container" id="cardsContainer"></div>
    </main>

    <!-- Modal de edição -->
    <div id="editModal">
        <div class="modal-content">
            <h2>Editar Licitação</h2>
            <form id="editForm">
                <input type="hidden" id="editId">

                <div>
                    <label>Data</label>
                    <input type="date" id="editData" required>
                </div>

                <div>
                    <label>Horário</label>
                    <input type="time" id="editHorario" required>
                </div>

                <div>
                    <label>Estado</label>
                    <input type="text" id="editEstado" required>
                </div>

                <div>
                    <label>Órgão</label>
                    <input type="text" id="editOrgao" required>
                </div>

                <div>
                    <label>Pregão</label>
                    <input type="text" id="editPregao" required>
                </div>

                <div>
                    <label>Serviço</label>
                    <input type="text" id="editServico" required>
                </div>

                <div>
                    <label>UASG</label>
                    <input type="text" id="editUasg" required>
                </div>

                <div>
                    <label>Status</label>
                    <select id="editStatus" required>
                        <option value="EM_ANDAMENTO">Em andamento</option>
                        <option value="CONCLUIDA">Concluída</option>
                        <option value="ADIADA">Adiada</option>
                        <option value="SUSPENSA">Suspensa</option>
                        <option value="REVOGADA">Revogada</option>
                    </select>
                </div>

                <div class="full-width">
                    <label>Observações</label>
                    <textarea id="editObservacoes"></textarea>
                </div>

                <div class="full-width buttons">
                    <button type="submit" class="btn btn-save">Salvar Alterações</button>
                    <button type="button" class="btn btn-cancel" onclick="fecharModal()">Cancelar</button>
                    <button type="button" class="btn btn-danger" id="btnExcluir">Excluir Licitação</button>
                </div>
            </form>
        </div>
    </div>

    <script src="dashboard.js"></script>
</body>

</html>
